name: Sync Gemini Clippings to Vault

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 (北京时间 10:00) 自动触发
  workflow_dispatch: # 支持在 GitHub 网页端手动一键触发运行

permissions:
  contents: write # 赋予 Actions 提交与推送代码权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade gdown python-docx

      - name: Download Clippings from Google Drive
        run: |
          mkdir -p Clippings/DailyDoseOfDS/
          python .github/scripts/download_drive_clippings.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Clippings/DailyDoseOfDS/
          if git status --porcelain | grep -q .; then
            git commit -m "auto: sync translated newsletter clippings from Gemini"
            git push
          else
            echo "No new clippings to commit."
          fi